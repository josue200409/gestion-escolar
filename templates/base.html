<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Gestión escolar{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #1e3a5f; color: #fff; padding: 0.75rem 1.5rem;
             display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    .tarjeta { background: #fff; border-radius: 8px; padding: 1rem 1.25rem;
               margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid #e4e7eb; }
    button, .boton { background: #2f6fed; color: #fff; border: 0; padding: 0.5rem 1rem;
                     border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 1rem; }
    input { padding: 0.5rem; width: 100%; box-sizing: border-box; margin: 0.25rem 0 0.75rem; }
    .error { color: #b42318; }
    .secundario { color: #52606d; }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'usuarios:inicio' %}">Gestión escolar</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <span>{{ user.get_full_name|default:user.username }} ({{ user.get_rol_display }})</span>
        <button type="submit">Cerrar sesión</button>
      </form>
    {% endif %}
  </header>
  <main>
        {% for mensaje in messages %}
      <div class="tarjeta">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
